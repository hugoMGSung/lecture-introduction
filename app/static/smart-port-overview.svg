<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">스마트 항만 디지털 트윈 데이터 흐름</title>
  <desc id="desc">실제 항만의 선박, 컨테이너, 차량, 크레인과 게이트에서 TOS, AIS, GPS, RFID, OCR, IoT 센서 데이터가 수집됩니다. 이 데이터가 디지털 트윈과 실시간으로 동기화되어 AI 분석, 항만 운영 최적화, 고장 예측, 안전관리와 의사결정에 활용됩니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2e4541"/><stop offset="1" stop-color="#405b53"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#718e83"/><stop offset="1" stop-color="#48665f"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce9dc"/><stop offset="1" stop-color="#bfd2c1"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c9d9c9" stroke-opacity=".08" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e5bf7a"/></marker>
    <marker id="arrowBack" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8 0L0 4L8 8Z" fill="#8eb29b"/></marker>
    <style>
      text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif}.mono{font-family:'DM Mono',monospace;letter-spacing:1.5px}.small{font-size:11px}.label{font-size:13px;font-weight:700}.muted{fill:#afc2b7}.cream{fill:#f3eddb}.green{fill:#344b48}
    </style>
  </defs>
  <rect width="1280" height="650" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="650" rx="14" fill="url(#grid)"/>
  <text x="34" y="37" class="mono muted" font-size="11">SMART PORT DIGITAL TWIN / SYSTEM FLOW</text>
  <circle cx="1236" cy="33" r="4" fill="#8fc49a"/><text x="1223" y="37" text-anchor="end" class="mono muted" font-size="10">LIVE DATA MODEL</text>

  <!-- Physical port -->
  <rect x="30" y="58" width="345" height="386" rx="9" fill="#f7f6ef" fill-opacity=".06" stroke="#bdcfc1" stroke-opacity=".24"/>
  <text x="52" y="88" class="mono" fill="#e4c486" font-size="10">01 / REAL PORT</text>
  <text x="52" y="111" class="cream" font-size="17" font-weight="700">실제 항만 · 물리 공간</text>
  <rect x="47" y="127" width="311" height="199" rx="5" fill="url(#sea)"/>
  <path d="M47 250H358V326H47Z" fill="#c6ac7e"/>
  <path d="M47 249H358" stroke="#e6d3a7" stroke-opacity=".6"/>
  <!-- ship -->
  <path d="M78 260H228L211 286H96Z" fill="#293f3b"/>
  <rect x="101" y="236" width="27" height="24" fill="#d97a59"/><rect x="131" y="228" width="27" height="32" fill="#e8d9b4"/>
  <rect x="161" y="236" width="27" height="24" fill="#d97a59"/><rect x="191" y="228" width="25" height="32" fill="#e8d9b4"/>
  <rect x="105" y="219" width="19" height="17" fill="#e8d9b4"/><rect x="135" y="211" width="19" height="17" fill="#d97a59"/>
  <!-- cranes -->
  <path d="M246 142V250M246 148H326M321 148V204M246 170L273 148M263 170V250M297 154V188" fill="none" stroke="#e8c27e" stroke-width="4"/>
  <path d="M279 195H338V251H279Z" fill="#718178" stroke="#e5d5af" stroke-opacity=".65"/>
  <rect x="286" y="204" width="24" height="23" fill="#d97a59"/><rect x="313" y="204" width="19" height="23" fill="#e5d5af"/>
  <!-- trucks and gate -->
  <path d="M67 303H122V320H67Z" fill="#e0b974"/><path d="M111 297H132L142 308V320H111Z" fill="#e0b974"/><circle cx="82" cy="322" r="5" fill="#2d423e"/><circle cx="128" cy="322" r="5" fill="#2d423e"/>
  <path d="M160 296V324M151 296H170M151 302H170" stroke="#f2e9d4" stroke-width="2"/>
  <!-- sensor nodes -->
  <g fill="#e9c47e" stroke="#fff0c9" stroke-width="2"><circle cx="91" cy="245" r="5"/><circle cx="246" cy="158" r="5"/><circle cx="300" cy="216" r="5"/><circle cx="128" cy="301" r="5"/></g>
  <g fill="none" stroke="#f4d896" stroke-opacity=".7" stroke-dasharray="3 5"><path d="M91 245C145 161 207 167 246 158"/><path d="M128 301C194 330 258 267 300 216"/><path d="M246 158C289 175 304 190 300 216"/></g>
  <text x="60" y="346" class="small muted">선박</text><text x="112" y="346" class="small muted">컨테이너</text><text x="205" y="346" class="small muted">크레인</text><text x="286" y="346" class="small muted">게이트</text>
  <rect x="49" y="365" width="307" height="54" rx="5" fill="#263b37" fill-opacity=".75"/>
  <text x="64" y="388" class="mono" fill="#e6c47f" font-size="9">PHYSICAL ASSETS</text>
  <text x="64" y="407" class="small cream">차량 · 장치장 · 하역장비 · 해양환경</text>

  <!-- data collection -->
  <path d="M380 250H411" fill="none" stroke="#e5bf7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="231" text-anchor="middle" class="mono" fill="#e8d5a9" font-size="8">COLLECT</text>
  <text x="426" y="88" class="mono" fill="#e4c486" font-size="10">02 / DATA INPUT</text>
  <text x="426" y="111" class="cream" font-size="17" font-weight="700">실시간 수집 · 연계</text>
  <g>
    <rect x="425" y="132" width="203" height="46" rx="5" fill="#f7f6ef" fill-opacity=".08" stroke="#c7d5c9" stroke-opacity=".2"/><circle cx="448" cy="155" r="12" fill="#e5bf7a" fill-opacity=".2"/><text x="448" y="159" text-anchor="middle" class="mono" fill="#f2d999" font-size="8">TOS</text><text x="469" y="159" class="label cream">운영 시스템</text>
    <rect x="425" y="189" width="203" height="46" rx="5" fill="#f7f6ef" fill-opacity=".08" stroke="#c7d5c9" stroke-opacity=".2"/><circle cx="448" cy="212" r="12" fill="#e5bf7a" fill-opacity=".2"/><text x="448" y="216" text-anchor="middle" class="mono" fill="#f2d999" font-size="8">AIS</text><text x="469" y="216" class="label cream">선박 · 위치 정보</text>
    <rect x="425" y="246" width="203" height="46" rx="5" fill="#f7f6ef" fill-opacity=".08" stroke="#c7d5c9" stroke-opacity=".2"/><circle cx="448" cy="269" r="12" fill="#e5bf7a" fill-opacity=".2"/><text x="448" y="273" text-anchor="middle" class="mono" fill="#f2d999" font-size="7">RFID</text><text x="469" y="273" class="label cream">화물 · 식별 정보</text>
    <rect x="425" y="303" width="203" height="46" rx="5" fill="#f7f6ef" fill-opacity=".08" stroke="#c7d5c9" stroke-opacity=".2"/><circle cx="448" cy="326" r="12" fill="#e5bf7a" fill-opacity=".2"/><text x="448" y="330" text-anchor="middle" class="mono" fill="#f2d999" font-size="8">IoT</text><text x="469" y="330" class="label cream">센서 · 영상 장비</text>
  </g>
  <text x="426" y="376" class="small muted">GPS · OCR · 장비 상태 데이터</text>
  <text x="426" y="397" class="small muted">고유 ID로 객체 데이터를 연결</text>
  <path d="M628 250H667" fill="none" stroke="#e5bf7a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648" y="231" text-anchor="middle" class="mono" fill="#e8d5a9" font-size="8">SYNC</text>

  <!-- digital twin -->
  <rect x="680" y="58" width="570" height="386" rx="9" fill="#f7f6ef" fill-opacity=".06" stroke="#bdcfc1" stroke-opacity=".24"/>
  <text x="704" y="88" class="mono" fill="#e4c486" font-size="10">03 / DIGITAL TWIN</text>
  <text x="704" y="111" class="cream" font-size="17" font-weight="700">항만 운영의 가상 모델</text>
  <rect x="702" y="128" width="526" height="197" rx="6" fill="url(#screen)"/>
  <rect x="702" y="128" width="526" height="197" rx="6" fill="url(#grid)" opacity=".6"/>
  <rect x="715" y="140" width="500" height="23" rx="3" fill="#344b48"/>
  <circle cx="730" cy="151" r="3" fill="#e1bb75"/><text x="741" y="155" class="mono" fill="#eff1e8" font-size="8">PORT DIGITAL TWIN</text><text x="1203" y="155" text-anchor="end" class="mono" fill="#a5d3a7" font-size="8">● SYNCED</text>
  <!-- mirrored terminal model -->
  <path d="M718 273H1010V306H718Z" fill="#9aae9e"/>
  <path d="M718 272H1010" stroke="#526e62" stroke-width="2"/>
  <path d="M740 218V272M740 222H815M810 222V272M740 236L760 222M757 237V272" fill="none" stroke="#718e7d" stroke-width="3"/>
  <rect x="772" y="247" width="30" height="25" fill="#d47a59"/><rect x="805" y="240" width="31" height="32" fill="#e5bb73"/><rect x="839" y="247" width="30" height="25" fill="#829b86"/>
  <path d="M870 274H982L969 292H884Z" fill="#435b53"/><rect x="894" y="258" width="19" height="16" fill="#df805d"/><rect x="917" y="251" width="19" height="23" fill="#e9c47e"/><rect x="940" y="258" width="19" height="16" fill="#829b86"/>
  <circle cx="770" cy="235" r="5" fill="#e28160"/><circle cx="899" cy="244" r="5" fill="#e28160"/><circle cx="970" cy="273" r="5" fill="#e28160"/>
  <path d="M770 235C832 187 914 198 970 273" fill="none" stroke="#d98260" stroke-dasharray="3 4"/>
  <!-- analytics panel -->
  <rect x="1024" y="175" width="190" height="137" rx="5" fill="#fffdf5" stroke="#d1ddce"/>
  <text x="1040" y="197" class="mono" fill="#718177" font-size="8">OPERATION INSIGHT</text>
  <text x="1040" y="222" fill="#344b48" font-size="12" font-weight="700">실시간 분석</text>
  <path d="M1042 277L1064 264L1082 269L1103 237L1123 247L1144 220L1162 231L1195 210" fill="none" stroke="#54836c" stroke-width="2.5"/>
  <path d="M1042 283H1194M1042 238H1194M1042 258H1194" stroke="#dce5da" stroke-width="1"/>
  <circle cx="1144" cy="220" r="4" fill="#df7653"/>
  <rect x="715" y="339" width="498" height="77" rx="5" fill="#263b37" fill-opacity=".7"/>
  <text x="733" y="362" class="mono" fill="#e6c47f" font-size="9">AI · ANALYSIS · OPTIMIZATION</text>
  <g font-size="11" class="cream"><text x="733" y="390">운영 효율 ↑</text><text x="850" y="390">고장 예측</text><text x="954" y="390">물류 지연 ↓</text><text x="1070" y="390">안전 · 의사결정</text></g>

  <!-- feedback loop -->
  <path d="M1150 455V475H130V455" fill="none" stroke="#8eb29b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrowBack)"/>
  <rect x="467" y="458" width="346" height="32" rx="16" fill="#48665b" stroke="#8eb29b" stroke-opacity=".45"/>
  <text x="640" y="479" text-anchor="middle" class="mono" fill="#d9ead9" font-size="9">ANALYZE → PREDICT → OPTIMIZE → OPERATE</text>
  <text x="642" y="512" text-anchor="middle" class="cream" font-size="12" font-weight="700">분석 결과를 실제 항만 운영에 반영하고 다시 데이터를 수집합니다</text>

  <!-- application map -->
  <g class="small">
    <rect x="30" y="535" width="190" height="76" rx="7" fill="#f7f6ef" fill-opacity=".07" stroke="#bdcfc1" stroke-opacity=".2"/><text x="48" y="558" class="mono" fill="#e4c486" font-size="9">VESSEL</text><text x="48" y="584" class="cream" font-size="12">입출항 · 선박 추적</text>
    <rect x="232" y="535" width="190" height="76" rx="7" fill="#f7f6ef" fill-opacity=".07" stroke="#bdcfc1" stroke-opacity=".2"/><text x="250" y="558" class="mono" fill="#e4c486" font-size="9">CARGO</text><text x="250" y="584" class="cream" font-size="12">컨테이너 · 위치 추적</text>
    <rect x="434" y="535" width="190" height="76" rx="7" fill="#f7f6ef" fill-opacity=".07" stroke="#bdcfc1" stroke-opacity=".2"/><text x="452" y="558" class="mono" fill="#e4c486" font-size="9">AUTOMATION</text><text x="452" y="584" class="cream" font-size="12">게이트 · 장치장 운영</text>
    <rect x="636" y="535" width="190" height="76" rx="7" fill="#f7f6ef" fill-opacity=".07" stroke="#bdcfc1" stroke-opacity=".2"/><text x="654" y="558" class="mono" fill="#e4c486" font-size="9">EQUIPMENT</text><text x="654" y="584" class="cream" font-size="12">하역장비 · 상태 관리</text>
    <rect x="838" y="535" width="190" height="76" rx="7" fill="#f7f6ef" fill-opacity=".07" stroke="#bdcfc1" stroke-opacity=".2"/><text x="856" y="558" class="mono" fill="#e4c486" font-size="9">SAFETY</text><text x="856" y="584" class="cream" font-size="12">항만 안전 · 환경 감시</text>
    <rect x="1040" y="535" width="210" height="76" rx="7" fill="#e1bc78"/><text x="1058" y="558" class="mono" fill="#526253" font-size="9">DATA-DRIVEN</text><text x="1058" y="584" class="green" font-size="12" font-weight="700">최적화된 항만 운영</text>
  </g>
  <text x="32" y="634" class="mono" fill="#a9beb1" font-size="8">TWIN THE PHYSICAL PORT. TURN LIVE DATA INTO BETTER DECISIONS.</text>
</svg>
